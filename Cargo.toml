[package]
name = "artificial-systems"
description = "High performance simulations of artificial systems: spin models, stochastic cellular automata and random matrix analysis of their time series"
authors = ["evf <eliseuv816@gmail.com>"]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
keywords = ["physics", "simulation", "monte-carlo", "ising", "cellular-automata"]

[features]
default = ["analysis", "parallel-linalg", "cli"]
# Random matrix analysis of time series matrices (eigenvalues via faer)
analysis = ["dep:faer"]
# Parallelism inside a single matrix product or eigendecomposition. Off for wasm32, where faer's
# thread pool does not build.
parallel-linalg = ["analysis", "faer/rayon"]
# `artsys` command line interface
cli = ["dep:clap", "dep:anyhow", "dep:colog"]

[dependencies]
rand = "0.10"
rand_xoshiro = "0.8"
rand_distr = "0.6"
rayon = "1.12"
ndarray = { version = "0.17", features = ["serde"] }
faer = { version = "0.24", optional = true, default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"
flate2 = "1.1"
csv = "1.4"
thiserror = "2.0"
log = "0.4"
clap = { version = "4.6", features = ["derive"], optional = true }
anyhow = { version = "1.0", optional = true }
colog = { version = "1.4", optional = true }

[dev-dependencies]
rstest = "0.26"
proptest = "1.11"
approx = "0.5"
criterion = { version = "0.8", features = ["html_reports"] }

[[bin]]
name = "artsys"
path = "src/bin/artsys/main.rs"
required-features = ["cli"]

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1

# Keep dense linear algebra usable in debug test runs
[profile.dev.package.faer]
opt-level = 3

[[bench]]
name = "sweeps"
harness = false
